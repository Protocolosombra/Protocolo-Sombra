<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROTOCOLO SOMBRA | ACCESO</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background-color: #050505; display: flex; justify-content: center; align-items: center; }
        .hero-card { background: rgba(10, 10, 10, 0.85); border: 1px solid #222; padding: 50px; text-align: center; border-radius: 8px; width: 90%; max-width: 400px; }
        h1 { color: #fff; letter-spacing: 8px; font-size: 28px; margin-bottom: 10px; }
        input { width: 100%; padding: 15px; margin-bottom: 20px; background: #000; border: 1px solid #444; color: #00d4ff; text-align: center; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; background: #fff; color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="hero-card">
    <h1>PROTOCOLO SOMBRA</h1>
    <input type="text" placeholder="CÓDIGO DE NODO" id="nodeCode">
    <button onclick="checkAccess()">VERIFICAR ACCESO</button>
</div>

<script>
    async function checkAccess() {
        const code = document.getElementById('nodeCode').value;
        const url_script = "https://script.google.com/macros/s/AKfycbyV30dS5o4ecTN4IqpUxsdjn_7JM0gE8n97b31QOFTyoL8P-h6dTU3HpTCHw05cAxYiAg/exec";
        
        let nivel = "Invitado";
        if(code === "SOMBRA2026") nivel = "COMANDANTE";
        else if(code === "NODO01") nivel = "OPERATIVO";

        if(nivel !== "Invitado") {
            alert("Acceso Autorizado: " + nivel);
            document.body.innerHTML = "<div class='hero-card'><h1>NIVEL: " + nivel + "</h1><p>Sistema operativo.</p></div>";
        } else {
            alert("ACCESO DENEGADO.");
        }

        await fetch(url_script, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: JSON.stringify({codigo: code, nivel: nivel}) 
        });
    }
</script>
</body>
</html>
