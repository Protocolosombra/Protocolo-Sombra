<script>
    async function checkAccess() {
        const code = document.getElementById('nodeCode').value;
        const url_script = "https://script.google.com/macros/s/AKfycbyMrz968e8ilKfiIDcfcjyU5k5n3BBrb-LKR4mguzuksJ71w_M35U4eiMaDrAYsldacyg/exec";

        if(code !== "") {
            await fetch(url_script, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({codigo: code, ip: "Usuario"})
            });
            alert("Protocolo iniciado. Redirigiendo a nodo seguro...");
        }
    }
</script>
